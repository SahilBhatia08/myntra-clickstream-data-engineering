# This is a Declarative Automation Bundle definition for myntra_clickstream.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: myntra_clickstream
  uuid: 4ff61229-be8a-41d7-b7d7-b385219fa2c4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405605127179078.18.azuredatabricks.net/
    variables:
      catalog: myntra_clickstream_de
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405605127179078.18.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/sahilkenaina@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sahilkenaina@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: myntra_clickstream_de_prod
    permissions:
      - user_name: sahilkenaina@gmail.com
        level: CAN_MANAGE
